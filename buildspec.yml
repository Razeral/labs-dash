version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
      - OUTBOUND_IP=$(curl -s --max-time 5 ifconfig.me) && echo "Outbound IP: $OUTBOUND_IP"
  build:
    commands:
      - node scripts/auto-roster.mjs --deploy
  post_build:
    commands:
      - node scripts/roster.mjs
